.gradient-text{
  background:linear-gradient(90deg,#c084fc,#a94cff,#22d3ee,#c084fc);
  background-size:220% auto;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  animation:gradient-slide 6s linear infinite
}

@keyframes gradient-slide{
  to{
    background-position:220% center
  }
}

@keyframes float-slow{
  0%,100%{
    transform:translate(0,0)
  }

  50%{
    transform:translate(18px,-26px)
  }
}

@keyframes float-slow-2{
  0%,100%{
    transform:translate(0,0)
  }

  50%{
    transform:translate(-22px,20px)
  }
}

@keyframes pulse-ring{
  0%{
    box-shadow:0 0 0 0 rgba(169,76,255,.55),0 0 40px #7e11d6
  }

  70%{
    box-shadow:0 0 0 22px rgba(169,76,255,0),0 0 55px #a94cff
  }

  100%{
    box-shadow:0 0 0 0 rgba(169,76,255,0),0 0 40px #7e11d6
  }
}

@keyframes twinkle{
  0%,100%{
    opacity:.25;
    transform:scale(.7)
  }

  50%{
    opacity:1;
    transform:scale(1.15)
  }
}

@keyframes shine{
  0%{
    transform:translateX(-140%) skewX(-18deg)
  }

  100%{
    transform:translateX(260%) skewX(-18deg)
  }
}

@keyframes border-flow{
  0%{
    background-position:0% 50%
  }

  50%{
    background-position:100% 50%
  }

  100%{
    background-position:0% 50%
  }
}

.animate-float{
  animation:float-slow 7s ease-in-out infinite
}

.animate-float-2{
  animation:float-slow-2 9s ease-in-out infinite
}

.animate-pulse-ring{
  animation:pulse-ring 2.8s ease-out infinite
}

.shine-wrap{
  position:relative;
  overflow:hidden
}

.shine-wrap::after{
  content:"";
  position:absolute;
  top:0;
  bottom:0;
  width:38%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
  animation:shine 3.2s ease-in-out infinite;
  pointer-events:none
}

.card-hover{
  transition:transform .3s ease,border-color .3s ease,box-shadow .3s ease,backdrop-filter .3s ease
}

.card-hover:hover{
  transform:translateY(-8px) scale(1.01);
  border-color:rgba(169,76,255,.65);
  box-shadow:0 0 40px rgba(126,17,214,.55),0 24px 55px rgba(0,0,0,.5);
  backdrop-filter:blur(30px);
  -webkit-backdrop-filter:blur(30px)
}

.btn-main{
  transition:.25s
}

.btn-main:hover{
  transform:translateY(-2px) scale(1.03);
  box-shadow:0 0 40px rgba(126,17,214,.75),0 0 18px rgba(34,211,238,.35);
  filter:brightness(1.08)
}

.btn-ghost{
  transition:.25s
}

.btn-ghost:hover{
  background:rgba(255,255,255,.12);
  transform:translateY(-2px);
  box-shadow:0 0 28px rgba(169,76,255,.35);
  backdrop-filter:blur(20px)
}

.chip-active{
  background:linear-gradient(90deg,#7e11d6,#a94cff)!important;
  color:white!important;
  border-color:transparent!important;
  box-shadow:0 0 24px rgba(126,17,214,.6)
}

.animated-border{
  background:linear-gradient(110deg,#7e11d6,#22d3ee,#a94cff,#7e11d6);
  background-size:250% 250%;
  animation:border-flow 5s ease infinite
}

.shot{
  transition:transform .5s ease,filter .5s ease
}

.group:hover .shot{
  transform:scale(1.06)
}

details summary{
  list-style:none
}

details summary::-webkit-details-marker{
  display:none
}

.last\:border-r-0:last-child{
  border-right-width: 0px;
}

.hover\:scale-105:hover{
  --tw-scale-x: 1.05;
  --tw-scale-y: 1.05;
  transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) skewX(var(--tw-skew-x)) skewY(var(--tw-skew-y)) scaleX(var(--tw-scale-x)) scaleY(var(--tw-scale-y));
}

.hover\:bg-\[\#e8d5ff\]:hover{
  --tw-bg-opacity: 1;
  background-color: rgb(232 213 255 / var(--tw-bg-opacity, 1));
}

.hover\:bg-white\/10:hover{
  background-color: rgb(255 255 255 / 0.1);
}

.hover\:text-white:hover{
  --tw-text-opacity: 1;
  color: rgb(255 255 255 / var(--tw-text-opacity, 1));
}

@media (min-width: 640px){
  .sm\:block{
    display: block;
  }

  .sm\:inline-flex{
    display: inline-flex;
  }

  .sm\:h-\[420px\]{
    height: 420px;
  }

  .sm\:w-\[420px\]{
    width: 420px;
  }

  .sm\:gap-5{
    gap: 1.25rem;
  }

  .sm\:p-10{
    padding: 2.5rem;
  }

  .sm\:p-6{
    padding: 1.5rem;
  }

  .sm\:px-6{
    padding-left: 1.5rem;
    padding-right: 1.5rem;
  }

  .sm\:py-16{
    padding-top: 4rem;
    padding-bottom: 4rem;
  }

  .sm\:pb-14{
    padding-bottom: 3.5rem;
  }

  .sm\:pb-20{
    padding-bottom: 5rem;
  }

  .sm\:pt-16{
    padding-top: 4rem;
  }

  .sm\:text-4xl{
    font-size: 2.25rem;
    line-height: 2.5rem;
  }

  .sm\:text-5xl{
    font-size: 3rem;
    line-height: 1;
  }

  .sm\:text-\[17px\]{
    font-size: 17px;
  }

  .sm\:text-\[22px\]{
    font-size: 22px;
  }

  .sm\:text-\[52px\]{
    font-size: 52px;
  }

  .sm\:text-\[92px\]{
    font-size: 92px;
  }

  .sm\:text-sm{
    font-size: 0.875rem;
    line-height: 1.25rem;
  }
}

@media (min-width: 768px){
  .md\:flex{
    display: flex;
  }

  .md\:hidden{
    display: none;
  }

  .md\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .md\:flex-row{
    flex-direction: row;
  }

  .md\:items-center{
    align-items: center;
  }
}

@media (min-width: 1024px){
  .lg\:grid-cols-3{
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }

  .lg\:grid-cols-4{
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }

  .lg\:grid-cols-\[1\.15fr_\.85fr\]{
    grid-template-columns: 1.15fr .85fr;
  }

  .lg\:grid-cols-\[1\.2fr_\.8fr\]{
    grid-template-columns: 1.2fr .8fr;
  }

  .lg\:border-b-0{
    border-bottom-width: 0px;
  }
}
